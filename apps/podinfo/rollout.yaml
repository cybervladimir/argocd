apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: podinfo
  strategy:
    canary:
      stableService: podinfo-stable
      canaryService: podinfo-canary
      trafficRouting:
        traefik:
          weightedTraefikServiceName: podinfo-weighted
      steps:
        - setWeight: 20
        - pause: {}            # waits for manual promote
        - setWeight: 50
        - pause: {duration: 30s}
        - setWeight: 80
        - pause: {duration: 30s}
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.8.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
